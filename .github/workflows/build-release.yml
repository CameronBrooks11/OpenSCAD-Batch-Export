name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.0.0, v2.0.1, etc.

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build CLI Executable
        run: |
          pyinstaller --onefile --name scadbatch scadbatch/export.py

      - name: Build GUI Executable
        run: |
          pyinstaller --onefile --windowed --name scadbatch-gui scadbatch/gui.py

      - name: Package Executables
        run: |
          New-Item -ItemType Directory -Force -Path build
          Compress-Archive -Path dist\scadbatch.exe, dist\scadbatch-gui.exe -DestinationPath build\scadbatch-windows.zip

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-executables
          path: build/scadbatch-windows.zip

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller

      - name: Build CLI Executable
        run: |
          pyinstaller --onefile --name scadbatch scadbatch/export.py

      - name: Build GUI Executable
        run: |
          pyinstaller --onefile --windowed --name scadbatch-gui scadbatch/gui.py

      - name: Package Executables
        run: |
          mkdir -p build
          tar -czvf build/scadbatch-linux.tar.gz -C dist scadbatch scadbatch-gui

      - name: Upload Linux Executable
        uses: actions/upload-artifact@v7
        with:
          name: linux-executables
          path: build/scadbatch-linux.tar.gz

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller

      - name: Build CLI Executable
        run: |
          pyinstaller --onefile --name scadbatch scadbatch/export.py

      - name: Build GUI Executable
        run: |
          pyinstaller --onefile --windowed --name scadbatch-gui scadbatch/gui.py

      - name: Package Executables
        run: |
          mkdir -p build
          tar -czvf build/scadbatch-macos.tar.gz -C dist scadbatch scadbatch-gui

      - name: Upload macOS Executable
        uses: actions/upload-artifact@v7
        with:
          name: macos-executables
          path: build/scadbatch-macos.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Windows Executables
        uses: actions/download-artifact@v8
        with:
          name: windows-executables
          path: ./windows

      - name: Download Linux Executables
        uses: actions/download-artifact@v8
        with:
          name: linux-executables
          path: ./linux

      - name: Download macOS Executables
        uses: actions/download-artifact@v8
        with:
          name: macos-executables
          path: ./macos

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}
            Description of the release.
          draft: false
          prerelease: false

      - name: Upload Windows Executable to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows/scadbatch-windows.zip
          asset_name: scadbatch-windows.zip
          asset_content_type: application/zip

      - name: Upload Linux Executable to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./linux/scadbatch-linux.tar.gz
          asset_name: scadbatch-linux.tar.gz
          asset_content_type: application/gzip

      - name: Upload macOS Executable to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./macos/scadbatch-macos.tar.gz
          asset_name: scadbatch-macos.tar.gz
          asset_content_type: application/gzip
