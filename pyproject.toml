[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openscad-batch-export"
version = "1.1.0"
description = "Batch export models from parametric OpenSCAD designs using CSV or Customizer JSON parameter sets."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Cameron K. Brooks", email = "cambrooks3393@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/CameronBrooks11/OpenSCAD-Batch-Export"
Issues = "https://github.com/CameronBrooks11/OpenSCAD-Batch-Export/issues"

[project.scripts]
openscad-export = "openscad_export.cli:main"

[project.gui-scripts]
openscad-export-gui = "openscad_export.gui:main"

[tool.setuptools.packages.find]
include = ["openscad_export*"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
